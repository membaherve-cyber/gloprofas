# GLOPROFAS — gloprofas.org (LWS shared hosting, Apache)
Options -Indexes

# ---------- Security headers ----------
<IfModule mod_headers.c>
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ---------- GZIP ----------
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>

<IfModule mod_expires.c>
  ExpiresActive On
  # Hashed build assets — immutable
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  # Images
  ExpiresByType image/jpeg "access plus 30 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/webp "access plus 30 days"
  ExpiresByType image/svg+xml "access plus 30 days"
  # HTML — always revalidate
  ExpiresByType text/html "access plus 0 seconds"
</IfModule>

RewriteEngine On

# ---------- API routing (Next.js contract → PHP) ----------
RewriteRule ^api/newsletter/?$            api/newsletter.php       [L]
RewriteRule ^api/contact/?$               api/contact.php          [L]
RewriteRule ^api/reports/?$               api/reports.php          [L]
RewriteRule ^api/get-involved/?$          api/get-involved.php     [L]
RewriteRule ^api/service-enquiry/?$       api/service-enquiry.php  [L]
RewriteRule ^api/check/?$                 api/check.php            [L]
RewriteRule ^api/assistant/?$             api/assistant.php        [L]
RewriteRule ^api/resources/checklists/?$  api/resources/checklists.php [L]
RewriteRule ^api/admin/login/?$           api/admin/login.php      [L]
RewriteRule ^api/admin/logout/?$          api/admin/logout.php     [L]
RewriteRule ^api/admin/data/?$            api/admin/data.php       [L]
RewriteRule ^api/admin/content/.+$        api/admin/content.php    [L]
RewriteRule ^api/admin/verify-video/?$    api/admin/verify-video.php [L]

# ---------- SPA fallback ----------
# The application is a single-page app served from index.html with
# hash routing (#/about, #/scams, …). Any deep path that is not a real
# file or directory serves the app shell.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ index.html [L]

# ---------- Protect API internals ----------
<FilesMatch "^_.*\.php$">
  Require all denied
</FilesMatch>
<FilesMatch "\.json$">
  Require all denied
</FilesMatch>
